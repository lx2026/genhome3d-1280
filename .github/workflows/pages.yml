name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "previews/**"
      - "references/**"
      - "catalog.json"
      - "benchmarks.json"
      - "assets/benchmarks/**"
      - "reports/**"
      - "package.json"
      - "package-lock.json"
      - "tools/build_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
        with:
          # Root manifests are included automatically. USDZ packages are served
          # on demand from raw GitHub and are unnecessary for a Pages build.
          sparse-checkout: |
            .github
            site
            previews
            references
            reports
            tools

      - name: Install site dependencies
        run: npm ci

      - name: Assemble site artifact
        run: |
          test ! -d assets
          npm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
